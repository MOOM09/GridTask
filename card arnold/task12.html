<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Card Grid</title>
    <link rel="stylesheet" href="task12.css">
</head>
<body>

    <div class="post-card">
        
        
        <div class="card-header">
            <div class="avatar"></div>
            <div class="user-info">
                <h3>Arnold Schwarzenegger</h3>
                <span>Editor</span>
            </div>
            <div class="menu-icon">▼</div>
        </div>

        <div class="card-text">
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed rhoncus nibh sapien, quis semper nunc mollis quis. Ut blandit, massa vel iaculis bibendum, elit tortor suscipit ante, in venenatis nisl dolor ac massa.</p>
        </div>

        
        <div class="card-image"></div>

        
        <div class="card-footer">
            <div class="footer-links">
                <a href="#">Like</a>
                <a href="#">Tweet</a>
                <a href="#">Comment</a>
            </div>
            <div class="footer-dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

    </div>

</body>
</html>
